# Workflow name is matched by coverage-comment.yml's workflow_run trigger — keep in sync when renaming.
name: UI

on:
  push:
    branches:
      - main
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "ui/**"
      - ".github/workflows/ui.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  check:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: ui

      - name: Lint
        run: npx eslint src/
        working-directory: ui

      - name: Test with coverage
        run: npm run test:coverage
        working-directory: ui

      - name: Build
        run: npm run build
        working-directory: ui

      - name: Upload coverage summary
        uses: actions/upload-artifact@v7
        if: github.ref_name == 'main'
        with:
          name: ui-coverage
          path: ui/coverage/coverage-summary.json

      - name: Download base coverage
        id: download-base-coverage
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@v23
        with:
          branch: main
          workflow_conclusion: success
          name: ui-coverage
          path: ui/coverage-base/
          if_no_artifact_found: warn

      # The report itself is rendered and posted by coverage-comment.yml, which has the
      # write token fork PRs don't get. Staged into a fixed layout so the artifact root
      # stays stable whether or not the base coverage was found.
      - name: Stage coverage report data
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p report/coverage report/coverage-base
          cp coverage/coverage-summary.json coverage/coverage-final.json report/coverage/
          if [ -f coverage-base/coverage-summary.json ]; then
            cp coverage-base/coverage-summary.json report/coverage-base/
          fi
        working-directory: ui

      - name: Upload coverage report data
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ui-coverage-report
          path: ui/report/
          if-no-files-found: error

      - name: Push coverage badge
        if: github.ref_name == 'main'
        run: |
          COVERAGE=$(node -p "require('./ui/coverage/coverage-summary.json').total.lines.pct")
          if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
            COLOR="brightgreen"
          elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
            COLOR="yellow"
          else
            COLOR="red"
          fi

          cd "$(mktemp -d)"
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin badges --depth=1
          git checkout badges

          printf '{"schemaVersion":1,"label":"UI coverage","message":"%s%%","color":"%s"}\n' "$COVERAGE" "$COLOR" > ui-coverage.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ui-coverage.json
          git diff --staged --quiet || (git commit -m "Update UI coverage badge" && git push origin badges)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
